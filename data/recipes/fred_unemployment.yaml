recipe_version: 1
id: fred_unemployment
name: U.S. unemployment rate
description: Monthly U.S. civilian unemployment rate, seasonally adjusted, from FRED series UNRATE.
business_context: Use for historical U.S. unemployment-rate questions. This snapshot covers January 2018 through December 2024.
concepts: [unemployment, unemployment rate, labor market]
table_id: unemployment_rate
columns:
  - name: observation_date
    type: DATE
    description: First day of the observation month
    paths: [[observation_date], [DATE]]
  - name: unemployment_rate
    type: DOUBLE
    unit: percent
    description: U.S. civilian unemployment rate, seasonally adjusted
    paths: [[UNRATE]]
source_name: FRED, Federal Reserve Bank of St. Louis
source_url: https://fred.stlouisfed.org/series/UNRATE
source:
  adapter: csv
  url: https://fred.stlouisfed.org/graph/fredgraph.csv
  allowed_hosts: [fred.stlouisfed.org]
  params: {id: UNRATE}
unique_key: [observation_date]
coverage: {column: observation_date, start: '2018-01-01', end: '2024-12-01', frequency: monthly}
filters:
  - {path: [observation_date], minimum: '2018-01-01', maximum: '2024-12-01'}
skip_missing: [[UNRATE]]
expected_rows: 84
