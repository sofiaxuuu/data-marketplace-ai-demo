recipe_version: 1
id: world_bank_us_gdp_per_capita
name: U.S. GDP per capita
description: Annual U.S. GDP per capita in current U.S. dollars from World Bank indicator NY.GDP.PCAP.CD.
business_context: U.S. output per person in current USD, not total GDP, constant-price GDP or PPP. The active snapshot covers 2015 through 2024.
facets: {geography: United States, measure: economic output per person, unit: current USD, price_basis: current prices, frequency: annual, coverage: '2015–2024'}
concepts: [GDP per capita, economic output per person]
table_id: gdp_per_capita
columns:
  - {name: year, type: INTEGER, description: Calendar year of the indicator observation, paths: [[date]]}
  - {name: gdp_per_capita_usd, type: DOUBLE, unit: current USD, description: GDP per capita in current U.S. dollars, paths: [[value]]}
source_name: World Bank Indicators API
source_url: https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.PCAP.CD
source:
  adapter: rest_json
  url: https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.PCAP.CD
  allowed_hosts: [api.worldbank.org]
  params: {date: '2015:2024', format: json, per_page: 100}
  records_path: [1]
  record_checks:
    - {path: [countryiso3code], equals: USA}
    - {path: [indicator, id], equals: NY.GDP.PCAP.CD}
  pagination: {mode: page, page_parameter: page, total_pages_path: [0, pages]}
unique_key: [year]
coverage: {column: year, start: '2015', end: '2024', frequency: annual}
filters:
  - {path: [year], minimum: 2015, maximum: 2024}
skip_missing: [[value]]
expected_rows: 10
