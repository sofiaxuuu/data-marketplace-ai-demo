benchmark_version: 1
name: DataScout snapshot-grounded selection benchmark
label_status: agent-authored, mechanically snapshot-verified; human review pending
cases:
  - id: fred_001
    split: development
    category: answerable
    question: What was the U.S. unemployment rate in January 2018?
    expected_outcome: select
    expected_data_products: [fred_unemployment]
    label_reason: The monthly U.S. UNRATE observation is in the snapshot.
    gold: {column: unemployment_rate, key: {observation_date: '2018-01-01'}, value: 4.0, unit: percent, absolute_tolerance: 0.000001}
  - id: fred_002
    split: development
    category: answerable
    question: What was the United States unemployment rate in December 2019?
    expected_outcome: select
    expected_data_products: [fred_unemployment]
